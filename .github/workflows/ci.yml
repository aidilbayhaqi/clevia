name: Clevia CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clevia
          POSTGRES_USER: clevia
          POSTGRES_PASSWORD: clevia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clevia -d clevia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://clevia:clevia@localhost:5432/clevia
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      ENVIRONMENT: test
      DEFAULT_CLINIC_SLUG: clevia
      AGENT_TRANSACTIONAL_TOOLS_ENABLED: "false"
      KNOWLEDGE_EMBEDDINGS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: >-
          ruff check
          app/agent app/llm app/knowledge app/tools app/observability
          app/core app/api/deps.py app/api/v1/routes/conversations.py
          app/api/v1/routes/knowledge.py app/api/v1/routes/public.py
          app/db/models/conversation.py app/db/models/knowledge.py
          app/db/models/observability.py tests evals scripts/seed.py
      - run: pytest -q
      - run: alembic upgrade head
      - run: python -m evals.runner --offline
      - run: python -m evals.p0_release_gate
      - run: python -m pip check
      - run: docker build -t clevia-api-ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_DEMO_MODE: "false"
      - run: docker build -t clevia-frontend-ci .
